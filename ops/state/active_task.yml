success_criteria:
  - wait for a dedicated CRM fixture payload and cleanup plan from the operator
  - run `ops/scripts/crm_fixture_payload_preflight.sh` first and require `payload_preflight_ready` before any Zoho-backed smoke
  - use `ops/scripts/crm_fixture_live_smoke.sh` for dry-run evidence first and validate it with `zoho crm fixture-evidence`
  - do not run a live CRM write unless a dedicated fixture payload, exact approval token, cleanup plan, and `ZOHO_CRM_ALLOW_LIVE_FIXTURE=1` are present
  - record redacted `crm.write.fixture_attempt` and `crm.write.fixture_result` evidence when a live smoke is intentionally run
  - require `zoho crm fixture-evidence` to report `live_fixture_recorded` before treating CRM live evidence as complete
  - keep normal `zoho crm upsert --execute` blocked
  - update Lane 2/3 docs and Lane 1 state
next_if_done: decide whether CRM v0.5 should broaden guarded upsert support or stop at fixture evidence for the RC.
