# On every release, update the formula in adwasd-dvd/tap:
#   1. Patch the URL and SHA256 to the new tarball
#   2. Run `brew update-python-resources` to regenerate ALL resource stanzas
#      (this ensures transitive deps like `idna` are never missing)
#
# Optional secret: HOMEBREW_TAP_TOKEN — PAT with `public_repo` + `workflow` scope.
# When the secret is absent, the workflow exits successfully and leaves the tap
# bump as a manual follow-up instead of failing the release workflow.
name: Bump Homebrew formula

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to bump, for example v0.2.1
        required: true

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - name: Check Homebrew tap token
        id: tap-token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not configured; skipping Homebrew tap bump."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Set up Homebrew
        if: steps.tap-token.outputs.available == 'true'
        uses: Homebrew/actions/setup-homebrew@main

      - name: Tap adwasd-dvd/tap
        if: steps.tap-token.outputs.available == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          brew tap adwasd-dvd/tap \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/adwasd-dvd/homebrew-tap.git"

      - name: Compute tarball SHA-256
        if: steps.tap-token.outputs.available == 'true'
        id: info
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${{ inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            echo "release tag is required" >&2
            exit 1
          fi
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          SHA=$(curl -fsSL "$URL" | shasum -a 256 | awk '{print $1}')
          VERSION="${TAG#v}"
          echo "tag=$TAG"       >> "$GITHUB_OUTPUT"
          echo "url=$URL"       >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Patch formula URL + SHA
        if: steps.tap-token.outputs.available == 'true'
        run: |
          FORMULA="$(brew formula adwasd-dvd/tap/zoho-cli)"
          python3 - "$FORMULA" "${{ steps.info.outputs.url }}" "${{ steps.info.outputs.sha }}" <<'PY'
          import sys, re
          path, url, sha = sys.argv[1], sys.argv[2], sys.argv[3]
          text = open(path).read()
          # Replace only the top-level url (first occurrence, before any resource block)
          text = re.sub(r'(?m)^  url "https://github\.com/[^"]*"', f'  url "{url}"', text, count=1)
          # Replace only the top-level sha256 (first occurrence)
          text = re.sub(r'(?m)^  sha256 "[0-9a-f]+"', f'  sha256 "{sha}"', text, count=1)
          open(path, 'w').write(text)
          PY

      - name: Regenerate all Python resource stanzas
        if: steps.tap-token.outputs.available == 'true'
        run: brew update-python-resources adwasd-dvd/tap/zoho-cli

      - name: Commit and push to tap
        if: steps.tap-token.outputs.available == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          REPO_DIR="$(brew --repo adwasd-dvd/tap)"
          cd "$REPO_DIR"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add Formula/zoho-cli.rb
          git diff --staged --quiet && echo "No changes." && exit 0
          git commit -m "zoho-cli ${{ steps.info.outputs.version }}"
          git push "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/adwasd-dvd/homebrew-tap.git" HEAD:main
