name: Bug report
description: Report a reproducible zoho-cli, docs, or OpenClaw workflow bug.
title: "[bug] "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a focused bug. Redact tokens, customer data, private
        messages, and account-specific secrets before submitting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the exact command sequence when possible.
      placeholder: |
        1. Run `zoho ...`
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened? Include sanitized stdout/stderr JSON if useful.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: zoho version
      description: Output from `zoho --version`.
      placeholder: 0.2.1rc1
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python/runtime, install method, and relevant OpenClaw context.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed tokens, secrets, customer data, private message bodies, and raw credentials.
          required: true
