[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zoho-cli"
version = "0.2.1"
description = "Unified Zoho CLI for Mail, Cliq, and CRM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "idna>=3.0",
    "keyring>=25",
    "platformdirs>=4",
]

[project.scripts]
zoho = "zoho_cli.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
pdf = ["pdfplumber>=0.11"]
word = ["python-docx>=1.0"]
csv = ["pandas>=2.0"]
crm-sdk = ["zohocrmsdk8_0==5.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["zoho_cli"]
