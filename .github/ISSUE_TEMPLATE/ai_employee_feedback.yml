name: AI employee observation
description: File sanitized feedback from an OpenClaw employee-agent run.
title: "[openclaw] "
labels:
  - agent-feedback
  - openclaw
  - needs-triage
body:
  - type: textarea
    id: observation
    attributes:
      label: Observation
      description: What did the agent notice while using the CLI?
    validations:
      required: true
  - type: dropdown
    id: classification
    attributes:
      label: Classification
      options:
        - Bug
        - Suggestion
        - Documentation
        - Unclear / needs triage
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Include commands, JSON snippets, status reactions, and version info.
      placeholder: |
        - Command: `zoho ...`
        - Version: `zoho --version`
        - Sanitized output: `{}`
  - type: textarea
    id: impact
    attributes:
      label: Agent impact
      description: How did this affect the employee-agent workflow?
    validations:
      required: true
  - type: textarea
    id: proposed-next-step
    attributes:
      label: Proposed next step
      description: Smallest useful fix, docs update, or triage question.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed tokens, secrets, customer data, private message bodies, and raw credentials.
          required: true
